<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guessing Game</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <!-- Home Screen -->
      <div id="home-screen" class="screen active">
        <div class="home-screen">
          <div class="logo">
            <i class="fas fa-brain"></i>
          </div>
          <h1>Guessing Game</h1>
          <p class="subtitle">Challenge your friends in real-time</p>

          <div class="input-group">
            <label for="creator-username">Enter Your Name</label>
            <input
              type="text"
              id="creator-username"
              placeholder="Your name..."
              maxlength="20"
            />
          </div>

          <div class="button-group">
            <button class="btn-primary" id="create-game-btn">
              <i class="fas fa-plus"></i>
              Create Game
            </button>
            <button class="btn-secondary" onclick="showScreen('join-screen')">
              <i class="fas fa-sign-in-alt"></i>
              Join Game
            </button>
          </div>
        </div>
      </div>

      <!-- Join Screen -->
      <div id="join-screen" class="screen">
        <button class="back-button" onclick="showScreen('home-screen')">
          <i class="fas fa-arrow-left"></i>
          Back
        </button>

        <div class="home-screen">
          <div class="logo">
            <i class="fas fa-door-open"></i>
          </div>
          <h1>Join Game</h1>
          <p class="subtitle">Enter the session code to join</p>

          <div class="input-group">
            <label for="username">Enter Your Name</label>
            <input
              type="text"
              id="username"
              placeholder="Your name..."
              maxlength="20"
            />
          </div>

          <div class="input-group">
            <label for="session-code">Session Code</label>
            <input
              type="text"
              id="session-code"
              placeholder="Enter code..."
              maxlength="6"
            />
          </div>

          <button class="btn-primary" id="join-game-btn" style="width: 100%">
            <i class="fas fa-sign-in-alt"></i>
            Join Session
          </button>
        </div>
      </div>

      <!-- Chat/Game Screen -->
      <div id="chat-screen" class="screen">
        <!-- Chat Header -->
        <div class="chat-header">
          <div class="session-info">
            <h3>Session: <span id="chat-session-code"></span></h3>
            <button class="copy-code-btn" title="Copy code">
              <i class="fas fa-copy"></i>
            </button>
          </div>

          <div class="game-status">
            <!-- Timer (only visible during game) -->
            <div class="timer" id="game-timer" style="display: none">
              <i class="fas fa-clock"></i>
              <span id="timer-display">60</span>
            </div>

            <!-- Players count -->
            <div class="players-count">
              <i class="fas fa-users"></i>
              <span id="header-player-count">1</span>
            </div>
          </div>
        </div>

        <!-- Main Chat Area -->
        <div class="chat-container">
          <!-- Sidebar -->
          <div class="chat-sidebar">
            <!-- Players List -->
            <div class="sidebar-section">
              <h4 class="sidebar-title">
                <i class="fas fa-users"></i> Players
              </h4>
              <div id="players-list" class="players-list">
                <!-- Players will be added dynamically -->
              </div>
            </div>

            <!-- Scoreboard -->
            <div class="sidebar-section">
              <h4 class="sidebar-title">
                <i class="fas fa-trophy"></i> Scoreboard
              </h4>
              <div id="scoreboard" class="scoreboard-list">
                <!-- Scores will be added dynamically -->
              </div>
            </div>

            <!-- Leave Button -->
            <button class="btn-danger leave-btn" onclick="leaveSession()">
              <i class="fas fa-sign-out-alt"></i>
              Leave
            </button>
          </div>

          <!-- Chat Messages Area -->
          <div class="chat-main">
            <!-- Question Banner (only visible during game) -->
            <div
              class="question-banner"
              id="question-banner"
              style="display: none"
            >
              <div class="question-label">Question:</div>
              <div class="question-text" id="active-question"></div>
              <div class="attempts-display" id="attempts-display">
                <!-- Dynamic hearts will be added here -->
              </div>
            </div>

            <!-- Messages Container -->
            <div class="messages-container" id="messages-container">
              <!-- Messages will be added dynamically -->
            </div>

            <!-- Input Area -->
            <div class="chat-input-area">
              <!-- Game Master Question Input -->
              <div
                class="input-wrapper question-input-wrapper"
                id="question-input-form"
                style="display: none"
              >
                <div class="question-form">
                  <input
                    type="text"
                    id="question-input"
                    class="chat-input"
                    placeholder="Enter question..."
                  />
                  <input
                    type="text"
                    id="answer-input"
                    class="chat-input"
                    placeholder="Enter answer..."
                  />
                  <div class="question-actions">
                    <button class="btn-success" onclick="setQuestion()">
                      <i class="fas fa-check"></i> Set Question
                    </button>
                  </div>
                </div>
              </div>

              <!-- Start Game Button (for GM after question is set) -->
              <div
                class="input-wrapper"
                id="start-game-wrapper"
                style="display: none"
              >
                <button
                  class="btn-primary start-game-btn"
                  onclick="startGame()"
                >
                  <i class="fas fa-play-circle"></i> Start Game
                </button>
              </div>

              <!-- Normal Chat Input (default) -->
              <div class="input-wrapper" id="normal-chat-input">
                <input
                  type="text"
                  id="chat-message-input"
                  class="chat-input"
                  placeholder="Type a message..."
                  disabled
                />
                <button class="send-btn" onclick="sendMessage()" disabled>
                  <i class="fas fa-paper-plane"></i>
                </button>
              </div>

              <!-- Answer Input (during game for players) -->
              <div
                class="input-wrapper"
                id="answer-submit-input"
                style="display: none"
              >
                <input
                  type="text"
                  id="answer-submit-field"
                  class="chat-input"
                  placeholder="Type your answer..."
                />
                <button class="send-btn" onclick="submitAnswer()">
                  <i class="fas fa-paper-plane"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
